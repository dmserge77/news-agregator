name: Сборка и деплой
on:
  schedule:
    - cron: '0 3,9,15,19 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Накопитель новостей живёт в кеше Actions, а не в репозитории.
      # Ключ меняется каждый запуск, restore-keys подтягивает последний доступный кеш.
      - name: Восстановление накопителя новостей
        uses: actions/cache/restore@v4
        with:
          path: |
            ai/news.json
            vibe/news.json
            agent/news.json
            platform/news.json
            design/news.json
            jobs/news.json
            orders/news.json
          key: news-store-${{ github.run_id }}
          restore-keys: |
            news-store-

      - name: Сбор новостей и дистрибутива
        run: python collector.py

      - name: Сохранение накопителя новостей
        uses: actions/cache/save@v4
        with:
          path: |
            ai/news.json
            vibe/news.json
            agent/news.json
            platform/news.json
            design/news.json
            jobs/news.json
            orders/news.json
          key: news-store-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
