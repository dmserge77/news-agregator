<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<title>💼 Вакансии</title>
<style>
:root{--bg:#f5f5f7;--card-bg:#fff;--text:#1d1d1f;--text2:#6e6e73;--border:#e5e5ea;--accent:#e34133;--shadow:0 2px 12px rgba(0,0,0,0.08)}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--card-bg:#2c2c2e;--text:#f5f5f7;--text2:#98989d;--border:#3a3a3c;--shadow:0 2px 12px rgba(0,0,0,0.3)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:20px}
.container{max-width:1100px;margin:0 auto}
header{text-align:center;padding:30px 0 10px}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(135deg,#0071e3,#5856d6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--text2);font-size:1rem;margin-top:4px}
.nav-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 10px}
.nav-btn{padding:8px 18px;border-radius:20px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);text-decoration:none;font-size:.85rem;transition:all .2s}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.cat-title{text-align:center;font-size:1.3rem;font-weight:600;margin:20px 0 16px}
.lang-bar,.sub-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.lang-bar.hidden,.sub-bar.hidden{display:none}
.lang-btn{padding:6px 18px;border-radius:20px;border:1.5px solid var(--border);background:var(--card-bg);color:var(--text);cursor:pointer;font-size:.85rem;transition:all .2s}
.lang-btn:hover{border-color:var(--accent);color:var(--accent)}
.lang-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.date-sep{font-size:.8rem;color:var(--text2);font-weight:600;padding:16px 0 6px;border-bottom:1px solid var(--border);margin-bottom:8px}
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px}
.news-card{background:var(--card-bg);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;cursor:pointer;animation:fadeIn .3s ease}
.news-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.news-card h3{font-size:.95rem;font-weight:600;line-height:1.4;margin:0}
.news-card .src{font-size:.75rem;color:var(--text2);margin-top:2px}
.news-card .src a{color:var(--accent);text-decoration:none;font-weight:500}
.news-card .src a:hover{text-decoration:underline}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;justify-content:center;align-items:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--card-bg);border-radius:16px;max-width:620px;width:100%;max-height:85vh;overflow-y:auto;padding:28px 24px;box-shadow:0 16px 48px rgba(0,0,0,.25)}
.modal .close{float:right;font-size:1.8rem;cursor:pointer;color:var(--text2);border:none;background:0;padding:0 4px}
.modal .close:hover{color:var(--text)}
.modal .m-date{font-size:.8rem;color:var(--text2);margin-bottom:8px}
.modal .m-title{font-size:1.3rem;font-weight:700;line-height:1.4;margin-bottom:16px;padding-right:24px}
.modal .m-body{font-size:.95rem;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.modal .m-footer{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:.85rem;color:var(--text2)}
.modal .m-footer a{color:var(--accent);text-decoration:none;font-weight:500}
.modal .m-footer a:hover{text-decoration:underline}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state .emoji{font-size:3rem;margin-bottom:16px}
footer{text-align:center;padding:40px 0 20px;color:var(--text2);font-size:.85rem}
</style>
</head>
<body>
<div class="container">
<header>
<h1><a href="../index.html" style="color:inherit;text-decoration:none">AI News Hub</a></h1>
<p>Нейросети · Вайбкодинг · ИИ-агенты · Платформы</p>
</header>
<nav class="nav-bar">
<a href="../index.html" class="nav-btn ">🏠 Все</a>
<a href="../ai/index.html" class="nav-btn ">🧠 Нейросети</a>
<a href="../vibe/index.html" class="nav-btn ">✨ Вайбкодинг</a>
<a href="../agent/index.html" class="nav-btn ">🤖 ИИ-агенты</a>
<a href="../platform/index.html" class="nav-btn ">⚡ Платформы</a>
<a href="../jobs/index.html" class="nav-btn active">💼 Вакансии</a>
<a href="../orders/index.html" class="nav-btn ">💰 Есть заказ</a>
</nav>
<h2 class="cat-title">💼 Вакансии <span id="lastUpdated" style="font-size:.7rem;color:var(--text2);font-weight:400;"></span></h2>
<div class="lang-bar" id="langBar">
<button class="lang-btn" data-lang="all">🌐 Все</button>
<button class="lang-btn active" data-lang="ru">🇷🇺 Русский</button>
<button class="lang-btn" data-lang="en">🇬🇧 English</button>
</div>
<div class="sub-bar hidden" id="jobBar">
<button class="lang-btn active" data-sub="all">📋 Все</button>
<button class="lang-btn" data-sub="ai_dev">🤖 AI-разработка</button>
<button class="lang-btn" data-sub="dev">💻 Разработка</button>
<button class="lang-btn" data-sub="design">🎨 Дизайн</button>
<button class="lang-btn" data-sub="test">🔍 Тестирование</button>
</div>
<div class="sub-bar hidden" id="orderBar">
<button class="lang-btn active" data-sub="all">📋 Все</button>
<button class="lang-btn" data-sub="sites">🌐 Сайты</button>
<button class="lang-btn" data-sub="prompts">✍️ Промты</button>
<button class="lang-btn" data-sub="ai">🤖 AI-задачи</button>
<button class="lang-btn" data-sub="design">🎨 Дизайн</button>
<button class="lang-btn" data-sub="content">📝 Контент</button>
</div>
<div class="news-grid" id="newsGrid"></div>
<footer></footer>
</div>
<div class="overlay" id="overlay">
<div class="modal">
<button class="close" onclick="closeModal()">&times;</button>
<div class="m-date" id="mDate"></div>
<div class="m-title" id="mTitle"></div>
<div class="m-body" id="mBody"></div>
<div class="m-footer"><a id="mSource" href="#"></a></div>
</div>
</div>
<script src="data.js"></script>
<script>
var raw = window.NEWS_DATA || {};
var items = Array.isArray(raw) ? raw : (raw.items || []);
var buildTime = raw.updated || new Date().toLocaleString('ru-RU', {timeZone:'Europe/Moscow'});
var activeLang = 'ru', activeSub = 'all';

function sortByDate(arr) { return arr.sort(function(a,b){return (b.date||'').localeCompare(a.date||'')}); }

function getFiltered() {
  var arr = sortByDate(items.slice());
  if (activeLang !== 'all') arr = arr.filter(function(n){ return n.lang === activeLang; });
  if (activeSub !== 'all') arr = arr.filter(function(n){ return (n.job_type||n.order_type) === activeSub; });
  return arr;
}

function render() {
  var grid = document.getElementById('newsGrid');
  var arr = getFiltered();
  if (arr.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="emoji">📭</div><p>Новостей пока нет</p></div>';
    return;
  }
  var html = '', lastDate = '';
  for (var i = 0; i < arr.length; i++) {
    var n = arr[i];
    html += '<div class="news-card" data-idx="' + i + '"><h3>' + n.title + '</h3><div class="src"><a href="' + n.link + '" target="_blank" rel="noopener">' + n.source + '</a></div></div>';
  }
  grid.innerHTML = html;
}

// Click on card — open modal
document.getElementById('newsGrid').addEventListener('click', function(e) {
  var card = e.target.closest('.news-card');
  if (!card) return;
  if (e.target.tagName === 'A') return;
  var idx = parseInt(card.getAttribute('data-idx'));
  var arr = getFiltered();
  var n = arr[idx];
  if (!n) return;
  document.getElementById('mDate').textContent = n.date;
  document.getElementById('mTitle').textContent = n.title;
  document.getElementById('mBody').textContent = n.desc || n.title;
  var src = document.getElementById('mSource');
  src.textContent = n.source;
    src.href = n.link;
    src.target = "_blank";
    src.rel = "noopener";
  document.getElementById('overlay').className = 'overlay open';
});

function closeModal() { document.getElementById('overlay').className = 'overlay'; }

// Lang filter
document.getElementById('langBar').addEventListener('click', function(e) {
  var btn = e.target.closest('.lang-btn');
  if (!btn) return;
  document.querySelectorAll('#langBar .lang-btn').forEach(function(b){b.classList.remove('active')});
  btn.classList.add('active');
  activeLang = btn.getAttribute('data-lang');
  render();
});

// Sub filters (jobs/orders)
var hasJobType = items.some(function(n){ return n.job_type; });
var hasOrderType = items.some(function(n){ return n.order_type; });
if (hasJobType) document.getElementById('jobBar').className = 'sub-bar';
if (hasOrderType) document.getElementById('orderBar').className = 'sub-bar';
[document.getElementById('jobBar'), document.getElementById('orderBar')].forEach(function(bar) {
  if (!bar) return;
  bar.addEventListener('click', function(e) {
    var btn = e.target.closest('.lang-btn');
    if (!btn) return;
    bar.querySelectorAll('.lang-btn').forEach(function(b){b.classList.remove('active')});
    btn.classList.add('active');
    activeSub = btn.getAttribute('data-sub');
    render();
  });
});

document.getElementById('lastUpdated').textContent = 'Обновлено: ' + buildTime + ' (МСК)';
document.getElementById('overlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
render();
</script>
</body>
</html>
