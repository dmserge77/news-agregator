<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI News Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>
:root {
  --bg: #f5f5f7; --card-bg: #ffffff; --text: #1d1d1f;
  --text2: #6e6e73; --border: #e5e5ea; --accent: #0071e3;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1e; --card-bg: #2c2c2e; --text: #f5f5f7;
    --text2: #98989d; --border: #3a3a3c; --shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5; padding: 20px;
}
.container { max-width: 1100px; margin: 0 auto; }

header {
  text-align: center;
  padding: 30px 0 20px;
}
header h1 {
  font-size: 2.5rem; font-weight: 700;
  background: linear-gradient(135deg, #0071e3, #5856d6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
header p { color: var(--text2); margin-top: 4px; font-size: 1.1rem; }
#lastUpdated { font-size: .85rem; color: var(--text2); margin-top: 4px; }

.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
  margin-top: 24px;
}
.cat-card {
  display: block;
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  text-decoration: none;
  color: var(--text);
  box-shadow: var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease;
}
.cat-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,.12);
  border-color: var(--accent);
}
.cat-emoji { font-size: 2.2rem; }
.cat-name { font-size: 1.1rem; font-weight: 600; margin-top: 10px; }
.cat-count { font-size: .85rem; color: var(--text2); margin-top: 4px; }

footer { color: var(--text2); font-size: 0.85rem; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>AI News Hub</h1>
    <p>Нейросети · Вайбкодинг · Дизайн · ИИ-агенты · Платформы</p>
    <div id="lastUpdated"></div>
  </header>

  <nav class="cat-grid">
<a href="ai/index.html" class="cat-card" style="--accent:#0071e3">
<div class="cat-emoji">🧠</div>
<div class="cat-name">Нейросети</div>
<div class="cat-count">209 новостей</div>
</a>
<a href="vibe/index.html" class="cat-card" style="--accent:#34c759">
<div class="cat-emoji">✨</div>
<div class="cat-name">Вайбкодинг</div>
<div class="cat-count">12 новостей</div>
</a>
<a href="agent/index.html" class="cat-card" style="--accent:#ff9500">
<div class="cat-emoji">🤖</div>
<div class="cat-name">ИИ-агенты</div>
<div class="cat-count">30 новостей</div>
</a>
<a href="platform/index.html" class="cat-card" style="--accent:#5856d6">
<div class="cat-emoji">⚡</div>
<div class="cat-name">Платформы</div>
<div class="cat-count">54 новостей</div>
</a>
<a href="design/index.html" class="cat-card" style="--accent:#e3a133">
<div class="cat-emoji">🎨</div>
<div class="cat-name">Дизайн</div>
<div class="cat-count">92 новостей</div>
</a>
<a href="jobs/index.html" class="cat-card" style="--accent:#e34133">
<div class="cat-emoji">💼</div>
<div class="cat-name">Вакансии</div>
<div class="cat-count">115 новостей</div>
</a>
<a href="orders/index.html" class="cat-card" style="--accent:#e3a133">
<div class="cat-emoji">💰</div>
<div class="cat-name">Есть заказ</div>
<div class="cat-count">107 новостей</div>
</a>
  </nav>

  <footer>
    Автосборщик новостей о мире AI
  </footer>
</div>
<script>
document.getElementById('lastUpdated').textContent =
    'Обновлено: ' + new Date().toLocaleString('ru-RU', {timeZone:'Europe/Moscow'}) + ' (МСК)' + ' · всего 619 новостей';
</script>
</body>
</html>
